# Your own Obysphere on any server with Docker: the Sphere, and Caddy in front of it for HTTPS (a
# Let's Encrypt certificate, renewed by itself). docs/self-host-docker.md walks through it.
#
#   curl -fsSLO https://raw.githubusercontent.com/obi-ai-bot/obi-sphere/main/deploy/docker/compose.yaml
#   curl -fsSL -o .env https://raw.githubusercontent.com/obi-ai-bot/obi-sphere/main/deploy/docker/.env.example
#   (put your domain in .env)
#   docker compose up -d
#   docker compose logs sphere          the one-time claim link
#
# Updating: docker compose pull && docker compose up -d

name: obysphere

services:
  sphere:
    image: ghcr.io/obi-ai-bot/obi-sphere:${SPHERE_VERSION:-latest}
    restart: unless-stopped
    environment:
      SPHERE_URL: https://${SPHERE_DOMAIN:?put your domain in .env}
      SPHERE_OPERATOR_TOKEN: ${SPHERE_OPERATOR_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CREATOR_WORKSPACES: ${CREATOR_WORKSPACES:-}
      SPHERE_CREATE_LIMIT: ${SPHERE_CREATE_LIMIT:-}
      PHONE_RELAY: ${PHONE_RELAY:-}
    volumes:
      - sphere:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy:/data
    depends_on:
      - sphere

configs:
  caddyfile:
    content: |
      ${SPHERE_DOMAIN}
      reverse_proxy sphere:8787

volumes:
  sphere:
  caddy:
