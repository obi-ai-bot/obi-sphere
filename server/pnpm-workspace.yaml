# The packages whose install scripts may run: each checks that its platform binary is in place.
allowBuilds:
  esbuild: true
  workerd: true

# `pnpm run` never installs or purges node_modules by itself. The e2e harness runs
# `pnpm run local` with its own HOME and TMPDIR, so pnpm there doesn't see the store or settings
# the install used; checking dependencies first would then try to reinstall them (and, with no
# TTY, fail). Installing is `pnpm install --frozen-lockfile`'s job, run before.
verifyDepsBeforeRun: false
