# The Sphere server (server/): types, its tests inside workerd, the conformance suite against its
# checker, the scenario's Sphere-side steps and concurrent sends against a local Sphere
# (`pnpm run local`), and its copies of oby's e2e fixtures against oby's dev.
#
# A draft pull request runs the workflow but skips its jobs, unless it has the `full-ci` label
# (that takes effect on the next push after labelling); marking it ready for review runs
# everything on the same head.
name: Server

on:
  pull_request:
    # Listing types replaces the default (opened, synchronize, reopened), so those stay explicit;
    # ready_for_review runs a draft that turned ready on the same head. No `labeled`: a run started
    # by another label would skip and post a success over a failed check on that head.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]

# A newer push to the same pull request cancels the run it supersedes; pushes to dev each run to
# the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      # oby's checkout, for check:fixtures and the scenario (server/e2e/fixtures.mjs).
      OBI_DIR: ${{ github.workspace }}/oby-fixtures
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm's version comes from server/package.json (packageManager), the same as spec/'s.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            spec/pnpm-lock.yaml

      - name: Install
        run: |
          (cd spec && pnpm install --frozen-lockfile)
          (cd server && pnpm install --frozen-lockfile)

      # server/e2e/fixtures/ are copies of oby's e2e fixtures (server/e2e/fixtures.mjs). oby is
      # public, so its dev is read without a token. check:fixtures and the scenario both compare the
      # copies with it and fail on any difference.
      - name: Check out oby's e2e fixtures
        uses: actions/checkout@v7
        with:
          repository: obi-ai-bot/oby
          ref: dev
          path: oby-fixtures
          persist-credentials: false
          sparse-checkout: e2e/fixtures/messages

      - name: Fixtures match oby's
        working-directory: server
        run: pnpm run check:fixtures

      - name: Validators match the spec's schemas
        working-directory: server
        run: pnpm run check:validators

      - name: Types
        working-directory: server
        run: pnpm run check

      - name: Tests (inside workerd, with D1)
        working-directory: server
        run: pnpm test

      - name: Launcher PID-only shutdown
        working-directory: server
        run: pnpm run test:shutdown

      - name: The scripted client's own tests
        working-directory: server
        run: pnpm run test:client

      - name: Conformance suite (spec/conformance/run.mjs --impl with the server's checker)
        working-directory: server
        run: pnpm run conformance

      - name: Scenario steps 1, 3, 5 and 7 against a local Sphere
        working-directory: server
        run: pnpm run scenario

      - name: Receiver track (careful receiver passes, reckless one fails) against a local Sphere
        working-directory: spec
        run: node --test conformance/receiver/receiver-track.test.mjs

      - name: 200 concurrent sends against a local Sphere, all recorded, one chain
        working-directory: server
        run: pnpm run load -- --sends 200
