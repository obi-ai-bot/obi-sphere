# The Sphere server (server/): types, its tests inside workerd, the conformance suite against its
# checker, and the scenario's Sphere-side steps against a local Sphere (`pnpm run local`).
name: Server

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from server/package.json (packageManager), the same as spec/'s.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            spec/pnpm-lock.yaml

      - name: Install
        run: |
          (cd spec && pnpm install --frozen-lockfile)
          (cd server && pnpm install --frozen-lockfile)

      - name: Validators match the spec's schemas
        working-directory: server
        run: pnpm run check:validators

      - name: Types
        working-directory: server
        run: pnpm run check

      - name: Tests (inside workerd, with D1)
        working-directory: server
        run: pnpm test

      - name: The scripted client's own tests
        working-directory: server
        run: pnpm run test:client

      - name: Conformance suite (spec/conformance/run.mjs --impl with the server's checker)
        working-directory: server
        run: pnpm run conformance

      - name: Scenario steps 1, 3, 5 and 7 against a local Sphere
        working-directory: server
        run: pnpm run scenario
