# The Sphere server (server/): types, its tests inside workerd, the conformance suite against its
# checker, the scenario's Sphere-side steps and concurrent sends against a local Sphere
# (`pnpm run local`), and its copies of obi's e2e fixtures against obi's (when it may read obi).
name: Server

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from server/package.json (packageManager), the same as spec/'s.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            spec/pnpm-lock.yaml

      - name: Install
        run: |
          (cd spec && pnpm install --frozen-lockfile)
          (cd server && pnpm install --frozen-lockfile)

      # server/e2e/fixtures/ are copies of obi's e2e fixtures (server/e2e/fixtures.mjs). obi is
      # private: reading it needs the secret OBI_READ_TOKEN (a fine-grained token with Contents:
      # read on obi-ai-bot/obi only), which a person creates; until they do, this is blocked on
      # them. Without it the comparison doesn't run and the run says so: a warning annotation and
      # a line in the job summary. With it, check:fixtures and the scenario both compare the
      # copies with obi's dev and fail on any difference.
      - name: Is there a token for reading obi?
        id: obi
        env:
          OBI_READ_TOKEN: ${{ secrets.OBI_READ_TOKEN }}
        run: |
          if [ -n "$OBI_READ_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Fixture drift check: runs (server/e2e/fixtures/ against obi's dev, with OBI_READ_TOKEN)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Fixture drift check skipped::The secret OBI_READ_TOKEN is not set, so server/e2e/fixtures/ are not compared with obi's e2e fixtures here. Blocked on a person: add a fine-grained token with Contents: read on obi-ai-bot/obi only, as this repository's Actions secret OBI_READ_TOKEN."
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo ":warning: **Fixture drift check skipped** ($RUNNER_OS): the secret \`OBI_READ_TOKEN\` is not set, so \`server/e2e/fixtures/\` were not compared with obi's e2e fixtures. Blocked on a person: add a fine-grained token with Contents: read on obi-ai-bot/obi only as this repository's Actions secret \`OBI_READ_TOKEN\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out obi's e2e fixtures
        if: steps.obi.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          repository: obi-ai-bot/obi
          ref: dev
          path: obi-fixtures
          token: ${{ secrets.OBI_READ_TOKEN }}
          sparse-checkout: e2e/fixtures/messages

      - name: Fixtures match obi's
        if: steps.obi.outputs.present == 'true'
        working-directory: server
        run: |
          echo "OBI_DIR=$GITHUB_WORKSPACE/obi-fixtures" >> "$GITHUB_ENV"
          OBI_DIR="$GITHUB_WORKSPACE/obi-fixtures" pnpm run check:fixtures

      - name: Validators match the spec's schemas
        working-directory: server
        run: pnpm run check:validators

      - name: Types
        working-directory: server
        run: pnpm run check

      - name: Tests (inside workerd, with D1)
        working-directory: server
        run: pnpm test

      - name: Launcher PID-only shutdown
        working-directory: server
        run: pnpm run test:shutdown

      - name: The scripted client's own tests
        working-directory: server
        run: pnpm run test:client

      - name: Conformance suite (spec/conformance/run.mjs --impl with the server's checker)
        working-directory: server
        run: pnpm run conformance

      - name: Scenario steps 1, 3, 5 and 7 against a local Sphere
        working-directory: server
        run: pnpm run scenario

      - name: 200 concurrent sends against a local Sphere, all recorded, one chain
        working-directory: server
        run: pnpm run load -- --sends 200
