# The protocol spec's self-check (spec/conformance/README.md): schemas, fixtures, reference verdicts.
name: Spec

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

# A newer push to the same pull request (or to dev) cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Spec self-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from spec/package.json (packageManager).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: spec/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: spec/pnpm-lock.yaml

      - name: Self-check
        run: make spec-check
